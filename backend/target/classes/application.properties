server.port=${PORT:8080}

# Spring datasource configuration (H2 persistent file mode by default)
spring.datasource.url=jdbc:h2:file:./data/clinicdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# H2 Console (available at /h2-console if needed for debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Serve frontend static assets
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.clinic=INFO
logging.level.org.springframework.jdbc=INFO
