<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — Apex Care Clinic</title>
  <meta name="description" content="Administrative login for Apex Care Clinic staff to manage patient appointments and doctor schedules.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f0fdfa 0%, #f1f5f9 100%);">

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand">
        <span class="brand-icon">+</span>
        <span>Apex Care</span>
      </a>
      <div>
        <a href="../index.html" class="btn btn-secondary btn-sm">← Back to Main Site</a>
      </div>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; flex: 1; padding: 3rem 1.5rem;">
    <div class="card" style="max-width: 420px; width: 100%; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">🔒</div>
        <h1 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Staff Sign In</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Access the clinic appointments &amp; doctor management portal</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="background: var(--surface-alt); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem;">
          🔑 <strong>Default credentials:</strong> username: <code>admin</code>, password: <code>admin123</code>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%;">
          Log In
        </button>
      </form>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already authenticated
      try {
        const session = await window.ClinicAPI.checkAdminSession();
        if (session.authenticated) {
          window.location.href = 'dashboard.html';
          return;
        }
      } catch (_) {}

      const form = document.getElementById('admin-login-form');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying...';

        try {
          await window.ClinicAPI.adminLogin(username, password);
          window.ClinicAPI.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        } catch (err) {
          window.ClinicAPI.showToast(err.message || 'Invalid username or password', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
